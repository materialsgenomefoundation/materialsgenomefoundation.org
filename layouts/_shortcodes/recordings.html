{{- with where hugo.Data.workshops "featured" true }}
<section class="recordings" aria-labelledby="recordings">
  <div class="section-head">
    <h2 id="recordings">Recordings</h2>
    <a href="{{ site.Params.youtube }}">All playlists on YouTube</a>
  </div>
  <ul class="video-grid" role="list">
    {{- range . }}
    <li class="video">
      {{- if site.Params.embedYouTube }}
      <div class="video-frame">
        <iframe src="https://www.youtube-nocookie.com/embed/videoseries?list={{ .playlist }}" title="{{ .title }} (YouTube playlist)" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      {{- else }}
      <a class="video-frame video-link" href="https://www.youtube.com/playlist?list={{ .playlist }}">
        <span class="play" aria-hidden="true"></span>
        <span class="visually-hidden">Watch {{ .title }} on YouTube</span>
      </a>
      {{- end }}
      <p class="video-title">{{ .title }}</p>
      <p class="video-date">{{ partial "workshop-date.html" . }}</p>
    </li>
    {{- end }}
  </ul>
</section>
{{- end }}
