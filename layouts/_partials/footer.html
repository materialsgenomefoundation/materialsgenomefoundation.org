<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <p class="footer-org">
      <img src="{{ "images/logos/mgf-mark.svg" | relURL }}" alt="" width="40" height="39">
      <span>{{ site.Title }}</span>
    </p>
    <ul class="footer-links" role="list">
      <li><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></li>
      <li><a href="mailto:{{ site.Params.mailingListSubscribe }}">Join the email list</a></li>
      <li><a href="{{ site.Params.youtube }}">YouTube</a></li>
      <li><a href="{{ site.Params.github }}">GitHub</a></li>
    </ul>
    <p class="footer-copy">© {{ site.Params.foundedYear }}–{{ now.Year }} {{ site.Title }}</p>
  </div>
</footer>
